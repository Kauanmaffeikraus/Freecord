name: Build and Release Freecord

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.5.0)'
        required: false
        default: 'v1.5.0'

permissions:
  contents: write

jobs:
  release-desktop:
    name: Build & Release Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Sync Version from Git Tag
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          CLEAN_VER="${RAW_TAG#v}"
          if [[ "$CLEAN_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            npm version "$CLEAN_VER" --no-git-tag-version --allow-same-version
          fi

      - name: Build Web Application
        run: npm run build

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Build and Publish Electron Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --publish always

  release-android:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Node Dependencies
        run: npm ci

      - name: Sync Version from Git Tag
        id: ver
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          CLEAN_VER="${RAW_TAG#v}"
          if [[ ! "$CLEAN_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            CLEAN_VER=$(node -p "require('./package.json').version")
            RAW_TAG="v${CLEAN_VER}"
          else
            npm version "$CLEAN_VER" --no-git-tag-version --allow-same-version
          fi
          VER_CODE=$(node -e "const p='${CLEAN_VER}'.split('-')[0].split('.').map(n=>parseInt(n,10)||0); console.log((p[0]||1)*10000 + (p[1]||0)*100 + (p[2]||0));")
          sed -i "s/versionCode [0-9]*/versionCode ${VER_CODE}/g" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${CLEAN_VER}\"/g" android/app/build.gradle
          echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "tag=${RAW_TAG}" >> $GITHUB_OUTPUT

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Freecord-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/Freecord-Android-v${{ steps.ver.outputs.version }}.apk"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release/Freecord-debug.apk
            release/Freecord-Android-v${{ steps.ver.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
